<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Produk</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
    img { max-width: 300px; }
    button { padding: 10px 20px; background: green; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div id="detail"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    Papa.parse("produk.csv", {
      download: true,
      header: true,
      complete: function(results) {
        const produk = results.data.find(p => p.id === id);
        if(produk) {
          document.getElementById("detail").innerHTML = `
            <h1>${produk.nama}</h1>
            <img src="${produk.gambar}" alt="${produk.nama}">
            <h2>Spesifikasi</h2>
            <p>${produk.deskripsi}</p>
            <br>
            <a href="https://wa.me/6281234567890?text=Halo, saya mau pesan ${encodeURIComponent(produk.nama)}" target="_blank">
              <button>Pesan via WhatsApp</button>
            </a>
            <p><a href="index.html">⬅ Kembali ke Toko</a></p>
          `;
        } else {
          document.getElementById("detail").innerHTML = "<p>Produk tidak ditemukan.</p>";
        }
      }
    });
  </script>
</body>
</html>

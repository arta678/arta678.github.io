<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Barang Arta</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 0;
      color: #111827;
      transition: background 0.3s, color 0.3s;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 10px;
    }
    input, select, button {
      padding: 8px;
      margin: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #e5e7eb;
      cursor: default;
    }
    th {
      background: #f9fafb;
      font-weight: 600;
      cursor: pointer;
    }
    tr:hover {
      background: #f3f4f6;
    }
    #stats {
      margin: 10px 0;
      text-align: center;
      font-weight: 600;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    #toggleDark {
      background: none;
      color: white;
      float: right;
      font-size: 20px;
      border: none;
    }

    /* 🌙 DARK MODE */
    body.dark {
      background: #111827;
      color: #e5e7eb;
    }
    body.dark header {
      background: #1e3a8a;
    }
    body.dark table {
      background: #1f2937;
      color: #e5e7eb;
    }
    body.dark th {
      background: #374151;
    }
    body.dark tr:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>
  <header>
    📦 Daftar Barang Arta
    <button id="toggleDark">🌙</button>
  </header>

  <div class="container">
    <div style="text-align:center;">
      <input type="text" id="search" placeholder="Cari barang..." />
      <select id="kategori"></select>
      <button id="refreshBtn">🔄 Muat Ulang</button>
      <button id="exportBtn">📤 Ekspor CSV</button>
    </div>

    <div id="stats"></div>

    <table id="tabelBarang">
      <thead>
        <tr>
          <th>Nama Barang</th>
          <th>Harga Jual</th>
          <th>Harga Dagang</th>
          <th>Harga Beli</th>
          <th>Kategori</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/1opsWaN0-f-aZEjqTx85jGlw6rBF4rXnGpUdakvW3Ixg/export?format=csv";
    let dataBarang = [];
    let sortDirection = 1;

    async function fetchData() {
      try {
        const res = await fetch(sheetUrl + "&rand=" + Math.random()); // cegah cache
        const csv = await res.text();
        dataBarang = Papa.parse(csv, { header: true }).data.filter(d => d["Nama Barang"]);
        isiKategori();
        updateTable();
        updateStats();
      } catch (e) {
        alert("Gagal memuat data!");
      }
    }

    function isiKategori() {
      const select = document.getElementById("kategori");
      const kategoriList = ["Semua", ...new Set(dataBarang.map(d => d.Kategori).filter(Boolean))];
      select.innerHTML = kategoriList.map(k => `<option value="${k}">${k}</option>`).join("");
      select.value = localStorage.getItem("lastKategori") || "Semua";
    }

    function getFiltered() {
      const cari = document.getElementById("search").value.toLowerCase();
      const kategori = document.getElementById("kategori").value;
      return dataBarang.filter(row => {
        const cocokKategori = kategori === "Semua" || row.Kategori === kategori;
        const cocokCari = Object.values(row).some(v => (v || "").toLowerCase().includes(cari));
        return cocokKategori && cocokCari;
      });
    }

    function updateTable() {
      const tbody = document.querySelector("#tabelBarang tbody");
      const filtered = getFiltered();
      tbody.innerHTML = filtered.map(row => `
        <tr>
          <td>${row["Nama Barang"] || ""}</td>
          <td>${row["Harga Jual"] || ""}</td>
          <td>${row["Harga Dagang"] || ""}</td>
          <td>${row["Harga Beli"] || ""}</td>
          <td>${row["Kategori"] || ""}</td>
        </tr>
      `).join("");
      updateStats();
    }

    function updateStats() {
      const total = dataBarang.length;
      const kategori = [...new Set(dataBarang.map(d => d.Kategori))].length;
      const avg = Math.round(
        dataBarang.reduce((sum, d) => sum + Number(d["Harga Jual"] || 0), 0) / (total || 1)
      ).toLocaleString("id-ID");
      document.getElementById("stats").innerHTML = `📦 ${total} barang • 📂 ${kategori} kategori • 💰 Rata-rata Rp ${avg}`;
    }

    // sorting kolom
    document.querySelectorAll("th").forEach((th, i) => {
      th.addEventListener("click", () => {
        const key = ["Nama Barang", "Harga Jual", "Harga Dagang", "Harga Beli", "Kategori"][i];
        dataBarang.sort((a, b) => (a[key] > b[key] ? sortDirection : -sortDirection));
        sortDirection *= -1;
        updateTable();
      });
    });

    // event listener
    document.getElementById("search").addEventListener("input", updateTable);
    document.getElementById("kategori").addEventListener("change", updateTable);
    document.getElementById("refreshBtn").addEventListener("click", fetchData);

    // Ekspor CSV
    document.getElementById("exportBtn").addEventListener("click", () => {
      const filtered = getFiltered();
      const csv = Papa.unparse(filtered);
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "data-barang.csv";
      link.click();
    });

    // Dark mode toggle
    const darkToggle = document.getElementById("toggleDark");
    darkToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("darkMode", document.body.classList.contains("dark"));
    });
    if (localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");

    // Simpan preferensi
    window.addEventListener("beforeunload", () => {
      localStorage.setItem("lastSearch", document.getElementById("search").value);
      localStorage.setItem("lastKategori", document.getElementById("kategori").value);
    });
    window.addEventListener("load", () => {
      document.getElementById("search").value = localStorage.getItem("lastSearch") || "";
    });

    fetchData();
  </script>
</body>
</html>

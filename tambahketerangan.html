<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Barang Toko Arta</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      color: #333;
    }

    header {
      background-color: #2563eb;
      color: white;
      padding: 12px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input[type="text"],
    select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      flex: 1;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #2563eb;
      color: white;
    }

    tr:hover {
      background-color: #f1f5f9;
      cursor: pointer;
    }

    /* Popup */
    #popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }

    .popup-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
      position: relative;
      animation: fadeIn 0.3s ease;
    }

    .close-btn {
      position: absolute;
      right: 10px;
      top: 5px;
      font-size: 22px;
      cursor: pointer;
      color: #666;
    }

    .close-btn:hover {
      color: #000;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }

    /* Loading */
    #loading-filter {
      display: none;
      text-align: center;
      margin-bottom: 10px;
      color: #2563eb;
      font-weight: 500;
    }

    #loading-filter .spinner {
      border: 3px solid #e0e7ff;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {transform: rotate(360deg);}
    }

    /* Mobile */
    @media (max-width: 600px) {
      .search-bar {
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }

      input[type="text"], select {
        font-size: 16px;
        padding: 12px;
      }

      table {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <header>📦 Daftar Barang Toko Arta</header>
  <main>
    <div class="search-bar">
      <input type="text" id="search" placeholder="Cari barang atau kategori..." oninput="updateTable()" />
      <select id="kategori" onchange="updateTable()">
        <option value="">Semua Kategori</option>
      </select>
    </div>

    <div id="loading-filter">
      <span class="spinner"></span>Memproses pencarian...
    </div>

    <table>
      <thead>
        <tr>
          <th>Nama Barang</th>
          <th>Harga</th>
          <th>Kategori</th>
          <th>Keterangan</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </main>

  <div id="popup"></div>

  <script>
    let dataBarang = [];

    async function fetchData() {
      const sheetId = "1opsWaN0-f-aZEjqTx85jGlw6rBF4rXnGpUdakvW3Ixg";
      const sheetName = "Sheet1";
      const url = `https://opensheet.elk.sh/${sheetId}/${sheetName}`;
      const loading = document.getElementById("loading-filter");
      loading.style.display = "block";

      const res = await fetch(url);
      dataBarang = await res.json();

      // isi dropdown kategori
      let kategoriSet = new Set(dataBarang.map(item => item.Kategori));
      const kategoriSelect = document.getElementById("kategori");
      kategoriSet.forEach(k => {
        if (k) {
          let opt = document.createElement("option");
          opt.value = k;
          opt.textContent = k;
          kategoriSelect.appendChild(opt);
        }
      });

      renderTable(dataBarang);
      loading.style.display = "none";
    }

    function renderTable(data) {
      const tableBody = document.getElementById("table-body");
      tableBody.innerHTML = "";
      data.forEach(item => {
        let row = `
          <tr onclick='showPopup(${JSON.stringify(item)})'>
            <td>${item["Nama Barang"]}</td>
            <td>Rp ${item.Harga}</td>
            <td>${item.Kategori}</td>
            <td>${item.Keterangan || "-"}</td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }

    function updateTable() {
      const loading = document.getElementById("loading-filter");
      loading.style.display = "block";

      setTimeout(() => {
        let searchText = document.getElementById("search").value.toLowerCase();
        let kategori = document.getElementById("kategori").value;

        let filtered = dataBarang.filter(item => {
          let namaMatch = item["Nama Barang"]?.toLowerCase().includes(searchText);
          let kategoriMatch = item["Kategori"]?.toLowerCase().includes(searchText);
          let filterKategori = (kategori === "" || item.Kategori === kategori);
          return (namaMatch || kategoriMatch) && filterKategori;
        });

        renderTable(filtered);
        loading.style.display = "none";
      }, 300);
    }

    function showPopup(item) {
      const popup = document.getElementById("popup");
      popup.style.display = "flex";
      popup.innerHTML = `
        <div class="popup-content">
          <span class="close-btn" onclick="closePopup()">&times;</span>
          <h3>${item["Nama Barang"]}</h3>
          <p><strong>Harga:</strong> Rp ${item.Harga}</p>
          <p><strong>Kategori:</strong> ${item.Kategori}</p>
          ${item.Keterangan ? `<p><strong>Keterangan:</strong> ${item.Keterangan}</p>` : ""}
        </div>
      `;
    }

    function closePopup() {
      document.getElementById("popup").style.display = "none";
    }

    fetchData();
  </script>
</body>
</html>

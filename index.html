<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Daftar Barang</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input { padding: 8px; width: 300px; margin-bottom: 15px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    .pagination { margin-top: 15px; }
    button { padding: 6px 12px; margin: 0 5px; }
  </style>
</head>
<body>
  <h1>Daftar Barang</h1>

  <input type="text" id="search" placeholder="Cari nama barang...">

  <table id="tabel-barang">
    <thead>
      <tr>
        <th>No</th>
        <th>Nama Barang</th>
        <th>Kategori</th>
        <th>Harga Jual</th>
        <th>Harga Beli</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="pagination">
    <button id="prev">Previous</button>
    <span id="page-info"></span>
    <button id="next">Next</button>
  </div>

  <script>
    let dataBarang = [];
    let currentPage = 1;
    const rowsPerPage = 20;

    function renderTable(data) {
      let tbody = document.querySelector("#tabel-barang tbody");
      tbody.innerHTML = "";

      let start = (currentPage - 1) * rowsPerPage;
      let end = start + rowsPerPage;
      let paginatedData = data.slice(start, end);

      paginatedData.forEach(row => {
        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.No}</td>
          <td>${row["Nama Barang"]}</td>
          <td>${row.Kategori}</td>
          <td>Rp ${Number(row["Harga Jual"]).toLocaleString("id-ID")}</td>
          <td>Rp ${Number(row["Harga Beli"]).toLocaleString("id-ID")}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("page-info").textContent =
        `Halaman ${currentPage} dari ${Math.ceil(data.length / rowsPerPage)}`;
    }

    function updateTable() {
      let searchText = document.getElementById("search").value.toLowerCase();
      let filtered = dataBarang.filter(item =>
        item["Nama Barang"].toLowerCase().includes(searchText)
      );
      renderTable(filtered);
    }

    document.getElementById("search").addEventListener("input", () => {
      currentPage = 1;
      updateTable();
    });

    document.getElementById("next").addEventListener("click", () => {
      let searchText = document.getElementById("search").value.toLowerCase();
      let filtered = dataBarang.filter(item =>
        item["Nama Barang"].toLowerCase().includes(searchText)
      );
      if (currentPage < Math.ceil(filtered.length / rowsPerPage)) {
        currentPage++;
        updateTable();
      }
    });

    document.getElementById("prev").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        updateTable();
      }
    });

    // Load CSV
    Papa.parse("barang.csv", {
      download: true,
      header: true,
      complete: function(results) {
        dataBarang = results.data.filter(row => row.No); // buang baris kosong
        updateTable();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabel Barang</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    select, input { padding: 6px; }
    button { padding: 6px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Daftar Barang</h2>
  
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Cari barang...">
    <select id="categorySelect">
      <option value="">Semua Kategori</option>
    </select>
  </div>

  <table id="barangTable">
    <thead>
      <tr>
        <th>Nama Barang</th>
        <th>Kategori</th>
        <th>Harga Beli</th>
        <th>Harga Jual</th>
        <th>Harga Dagang</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div>
    <button id="prevBtn">Sebelumnya</button>
    <button id="nextBtn">Selanjutnya</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSWQhy6XQR9Nq18cT09772ZjamQdt5gSi-F3yljpQjIGvZ2i-t6mtShVYPa_IyvpNTCnbT4tYExocqY/pub?output=csv"; // ganti dengan URL CSV Arta
    const rowsPerPage = 20;
    let currentPage = 1;
    let data = [];
    let filteredData = [];

    const tbody = document.querySelector("#barangTable tbody");
    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    // render tabel
    function renderTable() {
      tbody.innerHTML = "";
      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      filteredData.slice(start, end).forEach(item => {
        const row = `<tr>
          <td>${item.nama}</td>
          <td>${item.kategori}</td>
          <td>${item.harga_beli}</td>
          <td>${item.harga_jual}</td>
          <td>${item.harga_dagang}</td>
        </tr>`;
        tbody.insertAdjacentHTML("beforeend", row);
      });
    }

    // filter
    function applyFilter() {
      const searchText = searchInput.value.toLowerCase();
      const selectedCategory = categorySelect.value;
      filteredData = data.filter(item => {
        const matchText = item.nama.toLowerCase().includes(searchText);
        const matchCat = selectedCategory ? item.kategori === selectedCategory : true;
        return matchText && matchCat;
      });
      currentPage = 1;
      renderTable();
    }

    // ambil CSV dari Google Sheets
    Papa.parse(csvUrl, {
      download: true,
      header: true,
      complete: function(results) {
        data = results.data.map(item => ({
          nama: item.nama,
          kategori: item.kategori,
          harga_beli: item.harga_beli,
          harga_jual: item.harga_jual,
          harga_dagang: item.harga_dagang
        }));
        filteredData = data;

        // isi dropdown kategori
        const categories = [...new Set(data.map(item => item.kategori))];
        categories.forEach(cat => {
          const option = document.createElement("option");
          option.value = cat;
          option.textContent = cat;
          categorySelect.appendChild(option);
        });

        renderTable();
      }
    });

    // event listener
    searchInput.addEventListener("input", applyFilter);
    categorySelect.addEventListener("change", applyFilter);

    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderTable();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentPage * rowsPerPage < filteredData.length) {
        currentPage++;
        renderTable();
      }
    });
  </script>
</body>
</html>

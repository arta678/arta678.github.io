<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Toko Online</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    .produk { display: inline-block; margin: 15px; border: 1px solid #ddd; padding: 10px; width: 200px; }
    img { max-width: 100%; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Daftar Produk</h1>
  <div id="daftar-produk"></div>

  <script>
    Papa.parse("produk.csv", {
      download: true,
      header: true,
      complete: function(results) {
        const container = document.getElementById("daftar-produk");
        results.data.forEach(item => {
          if(item.nama) {
            const div = document.createElement("div");
            div.className = "produk";
            div.innerHTML = `
              <h3>${item.nama}</h3>
              <a href="detail.html?id=${item.id}">
                <img src="${item.gambar}" alt="${item.nama}">
              </a>
            `;
            container.appendChild(div);
          }
        });
      }
    });
  </script>
</body>
</html>

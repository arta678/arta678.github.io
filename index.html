<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Online Arta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library untuk baca CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 text-center text-2xl font-bold">
    Toko Online Arta
  </header>

  <!-- Search -->
  <div class="p-4 flex justify-center">
    <input type="text" id="search" placeholder="Cari produk..."
           class="w-full md:w-1/2 p-2 border rounded-lg shadow">
  </div>

  <!-- Produk -->
  <main id="product-list" class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6"></main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white text-center p-4 mt-6">
    © 2025 Toko Online Arta - Semua Hak Dilindungi
  </footer>

  <script>
    const whatsappNumber = "628123456789"; // Ganti dengan nomor WA kamu
    let products = [];

    // Fungsi render produk
    function renderProducts(filter = "") {
      const productList = document.getElementById("product-list");
      productList.innerHTML = "";
      products
        .filter(p => p.Nama.toLowerCase().includes(filter.toLowerCase()))
        .forEach(product => {
          const productCard = document.createElement("div");
          productCard.className = "bg-white rounded-2xl shadow p-4 text-center";

          productCard.innerHTML = `
            <img src="${product.Gambar}" alt="${product.Nama}" class="mx-auto rounded-lg">
            <h2 class="text-lg font-semibold mt-2">${product.Nama}</h2>
            <a href="https://wa.me/${whatsappNumber}?text=Halo%20saya%20mau%20pesan%20${encodeURIComponent(product.Nama)}"
               target="_blank"
               class="mt-3 inline-block bg-green-500 text-white px-4 py-2 rounded-lg shadow hover:bg-green-600">
              Pesan via WA
            </a>
          `;
          productList.appendChild(productCard);
        });
    }

    // Ambil file CSV
    Papa.parse("produk.csv", {
      download: true,
      header: true,
      complete: function(results) {
        products = results.data;
        renderProducts();
      }
    });

    // Search event
    document.getElementById("search").addEventListener("input", (e) => {
      renderProducts(e.target.value);
    });
  </script>

</body>
</html>

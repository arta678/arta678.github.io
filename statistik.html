<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Barang</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      background: #f9fafb;
      color: #333;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 14px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    main {
      padding: 12px;
      max-width: 1000px;
      margin: auto;
    }
    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }
    input, select {
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #bbb;
      border-radius: 8px;
      flex: 1;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    select { min-width: 160px; }

    /* Statistik Ringkas - versi sederhana */
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      font-size: 0.95rem;
      margin-bottom: 15px;
      color: #444;
      justify-content: flex-start;
    }
    .stats-bar span {
      background: #e5e7eb;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .table-container {
      overflow-x: auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 10px 12px;
      text-align: left;
      white-space: nowrap;
    }
    th { background: #f3f4f6; }

    .no-data {
      text-align: center;
      padding: 15px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>📦 Daftar Barang</header>
  <main>
    <div class="search-bar">
      <input type="text" id="search" placeholder="🔍 Cari barang..." />
      <select id="kategori">
        <option value="">📂 Semua Kategori</option>
      </select>
    </div>

    <!-- Statistik Ringkas -->
    <div class="stats-bar">
      <span>Jumlah Barang: <b id="total-barang">0</b></span>
      <span>Jumlah Kategori: <b id="total-kategori">0</b></span>
      <span>Harga Tertinggi: <b id="harga-tertinggi">-</b></span>
      <span>Harga Terendah: <b id="harga-terendah">-</b></span>
    </div>

    <div class="table-container">
      <table id="tabel-barang">
        <thead>
          <tr>
            <th>Nama Barang</th>
            <th>Harga Jual</th>
            <th>Kategori</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script>
    const CSV_BASE_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vRCXZLMSDuJF52ErgdMsRf9oOFdRa5ejt0CtNES-TOjSSC5ZnOGof3qMm_GmbLdClZ3v4nIyBzv99rE/pub?output=csv";

    let dataBarang = [];
    let filteredData = [];

    Papa.parse(CSV_BASE_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        dataBarang = results.data.filter(r => r["Nama Barang"]);
        populateKategori();
        renderTable(dataBarang);
        updateStats(dataBarang);
      },
    });

    function populateKategori() {
      const select = document.getElementById("kategori");
      const kategoriUnik = [...new Set(dataBarang.map(i => i.Kategori).filter(Boolean))];
      kategoriUnik.forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = k;
        select.appendChild(opt);
      });
    }

    function renderTable(data) {
      const tbody = document.querySelector("#tabel-barang tbody");
      tbody.innerHTML = "";
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="3" class="no-data">Tidak ada data</td></tr>`;
        return;
      }
      data.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r["Nama Barang"]}</td>
          <td>Rp ${Number(r["Harga Jual"]).toLocaleString("id-ID")}</td>
          <td>${r["Kategori"] || "-"}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateStats(data) {
      const totalBarang = data.length;
      const totalKategori = new Set(data.map(i => i.Kategori).filter(Boolean)).size;
      const harga = data.map(i => Number(i["Harga Jual"])).filter(n => !isNaN(n));

      const tertinggi = harga.length ? Math.max(...harga) : 0;
      const terendah = harga.length ? Math.min(...harga) : 0;

      document.getElementById("total-barang").textContent = totalBarang;
      document.getElementById("total-kategori").textContent = totalKategori;
      document.getElementById("harga-tertinggi").textContent = harga.length ? `Rp ${tertinggi.toLocaleString("id-ID")}` : "-";
      document.getElementById("harga-terendah").textContent = harga.length ? `Rp ${terendah.toLocaleString("id-ID")}` : "-";
    }

    // Event: pencarian dan filter kategori
    document.getElementById("search").addEventListener("input", applyFilters);
    document.getElementById("kategori").addEventListener("change", applyFilters);

    function applyFilters() {
      const keyword = document.getElementById("search").value.toLowerCase();
      const kategori = document.getElementById("kategori").value;
      filteredData = dataBarang.filter(r => {
        const cocokNama = r["Nama Barang"]?.toLowerCase().includes(keyword);
        const cocokKategori = !kategori || r["Kategori"] === kategori;
        return cocokNama && cocokKategori;
      });
      renderTable(filteredData);
      updateStats(filteredData);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Barang</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9fafb;
      color: #333;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
    }
    main {
      padding: 15px;
      max-width: 1000px;
      margin: auto;
    }
    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }
    input, select {
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    input {
      flex: 1;
      min-width: 200px;
    }
    select {
      background: white;
      min-width: 150px;
    }
    .table-container {
      overflow-x: auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 700px;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #f3f4f6;
      font-weight: bold;
    }
    tr:hover {
      background: #f9f9f9;
    }
    td:first-child {
      color: #2563eb;
      cursor: pointer;
      font-weight: 600;
    }
    .pagination {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      transition: 0.2s;
    }
    button:hover {
      background: #1e40af;
    }
    #page-info {
      font-size: 1rem;
    }

    /* Popup modern */
    #popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #popup-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      animation: fadeIn 0.3s ease;
    }
    #popup-box h2 {
      margin-top: 0;
      color: #2563eb;
    }
    #popup-box p {
      margin: 8px 0;
      text-align: left;
    }
    #popup-box button {
      margin-top: 10px;
      width: 48%;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      header { font-size: 1.2rem; padding: 12px; }
      th, td { padding: 8px; font-size: 0.9rem; }
      button { font-size: 0.9rem; padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <header>📦 Daftar Barang</header>
  <main>
    <div class="search-bar">
      <input type="text" id="search" placeholder="🔍 Cari nama barang...">
      <select id="kategori">
        <option value="">📂 Semua Kategori</option>
      </select>
    </div>

    <div class="table-container">
      <table id="tabel-barang">
        <thead>
          <tr>
            <th>Nama Barang</th>
            <th>Harga Jual</th>
            <th>Harga Grosir</th>
            <th>Kode</th>
            <th>Kategori</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="pagination">
      <button id="prev">⬅️ Previous</button>
      <span id="page-info"></span>
      <button id="next">Next ➡️</button>
    </div>
  </main>

  <!-- Popup -->
  <div id="popup-overlay">
    <div id="popup-box">
      <h2 id="popup-nama"></h2>
      <p><b>Harga Jual:</b> <span id="popup-hjual"></span></p>
      <p><b>Harga Grosir:</b> <span id="popup-hgrosir"></span></p>
      <p><b>Kode:</b> <span id="popup-kode"></span></p>
      <p><b>Kategori:</b> <span id="popup-kategori"></span></p>
      <button onclick="bagikanPopup()">📤 Bagikan</button>
      <button onclick="tutupPopup()">❌ Tutup</button>
    </div>
  </div>

  <script>
    let dataBarang = [];
    let currentPage = 1;
    const rowsPerPage = 14;

    function renderTable(data) {
      let tbody = document.querySelector("#tabel-barang tbody");
      tbody.innerHTML = "";

      let start = (currentPage - 1) * rowsPerPage;
      let end = start + rowsPerPage;
      let paginatedData = data.slice(start, end);

      paginatedData.forEach(row => {
        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row["Nama Barang"]}</td>
          <td>Rp ${Number(row["Harga Jual"]).toLocaleString("id-ID")}</td>
          <td>${row["Harga Grosir"]}</td>
          <td>${row["Kode"]}</td>
          <td>${row.Kategori}</td>
        `;
        // Klik nama barang untuk popup
        tr.querySelector("td:first-child").addEventListener("click", () => tampilPopup(row));
        tbody.appendChild(tr);
      });

      document.getElementById("page-info").textContent =
        `Halaman ${currentPage} dari ${Math.ceil(data.length / rowsPerPage)}`;
    }

    function updateTable() {
      let searchText = document.getElementById("search").value.toLowerCase();
      let kategori = document.getElementById("kategori").value;

      let filtered = dataBarang.filter(item => {
        let cocokNama = item["Nama Barang"].toLowerCase().includes(searchText);
        let cocokKategori = kategori === "" || item.Kategori === kategori;
        return cocokNama && cocokKategori;
      });

      renderTable(filtered);
    }

    function tampilPopup(row) {
      document.getElementById("popup-nama").textContent = row["Nama Barang"];
      document.getElementById("popup-hjual").textContent = "Rp " + Number(row["Harga Jual"]).toLocaleString("id-ID");
      document.getElementById("popup-hgrosir").textContent = row["Harga Grosir"];
      document.getElementById("popup-kode").textContent = row["Kode"];
      document.getElementById("popup-kategori").textContent = row["Kategori"];

      document.getElementById("popup-overlay").style.display = "flex";
    }

    function tutupPopup() {
      document.getElementById("popup-overlay").style.display = "none";
    }

    async function bagikanPopup() {
      const popup = document.querySelector("#popup-box");
      const scale = window.devicePixelRatio || 2;

      const canvas = await html2canvas(popup, {
        scale: scale,
        backgroundColor: "#ffffff",
        useCORS: true
      });

      const imageData = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.href = imageData;
      link.download = "barang.png";
      link.click();

      const pesan = "Berikut detail barang dari toko saya 👇";
      const whatsappURL = `https://wa.me/?text=${encodeURIComponent(pesan)}`;
      window.location.href = whatsappURL;

      alert("📸 Gambar popup tersimpan dengan kualitas tinggi! Sekarang pilih kontak di WhatsApp untuk mengirim pesan.");
    }

    document.getElementById("search").addEventListener("input", () => {
      currentPage = 1;
      updateTable();
    });

    document.getElementById("kategori").addEventListener("change", () => {
      currentPage = 1;
      updateTable();
    });

    document.getElementById("next").addEventListener("click", () => {
      let filtered = dataBarang.filter(item => {
        let cocokNama = item["Nama Barang"].toLowerCase().includes(document.getElementById("search").value.toLowerCase());
        let cocokKategori = document.getElementById("kategori").value === "" || item.Kategori === document.getElementById("kategori").value;
        return cocokNama && cocokKategori;
      });

      if (currentPage < Math.ceil(filtered.length / rowsPerPage)) {
        currentPage++;
        renderTable(filtered);
      }
    });

    document.getElementById("prev").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        updateTable();
      }
    });

    Papa.parse("https://docs.google.com/spreadsheets/d/e/2PACX-1vRCXZLMSDuJF52ErgdMsRf9oOFdRa5ejt0CtNES-TOjSSC5ZnOGof3qMm_GmbLdClZ3v4nIyBzv99rE/pub?output=csv", {
      download: true,
      header: true,
      complete: function(results) {
        dataBarang = results.data.filter(row => row["Nama Barang"]);
        let kategoriUnik = [...new Set(dataBarang.map(item => item.Kategori))];
        let select = document.getElementById("kategori");
        kategoriUnik.forEach(kat => {
          let opt = document.createElement("option");
          opt.value = kat;
          opt.textContent = kat;
          select.appendChild(opt);
        });
        updateTable();
      }
    });
  </script>
</body>
</html>
